spring.application.name=splitmate-api

# --- Active Profile ---
spring.profiles.active=dev

# --- PostgreSQL DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/splitmate
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT Configuration ---
# IMPORTANT: Replace this secret with a strong, unique value in production.
# Must be at least 32 bytes (256 bits) for HMAC-SHA256.
splitmate.jwt.secret=SplitMate-JWT-Secret-Key-Change-In-Production-Min-32-Bytes!
splitmate.jwt.expiration-seconds=900

# --- Server ---
server.port=8080

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
