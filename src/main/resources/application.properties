spring.application.name=splitmate-api

# Active Profile
spring.profiles.active=dev

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:splitmate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
splitmate.jwt.secret=${JWT_SECRET:SplitMate-JWT-Secret-Key-Change-In-Production-Min-32-Bytes!}
splitmate.jwt.expiration-seconds=900

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
