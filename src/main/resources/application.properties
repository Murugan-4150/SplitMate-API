spring.application.name=splitmate-api

# Active Profile

spring.profiles.active=dev

# PostgreSQL DataSource

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitmate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration

splitmate.jwt.secret=${JWT_SECRET:SplitMate-JWT-Secret-Key-Change-In-Production-Min-32-Bytes!}
splitmate.jwt.expiration-seconds=900

# Server

server.port=8080

# Actuator

management.endpoints.web.exposure.include=health,info
